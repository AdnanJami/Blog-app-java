# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    restart: always
    ports:
      # Set DB_PORT (e.g. 5433) if something else on this machine already uses 5432
      - "${DB_PORT:-5432}:5432"
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: example

  adminer:
    image: adminer
    restart: always
    ports:
      - 8888:8080
