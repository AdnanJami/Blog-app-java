# Local development:  docker compose up -d
#   Starts PostgreSQL and Adminer; run the backend and frontend yourself.
# Full stack:         docker compose --profile app up -d --build
#   Also builds and runs the backend (http://localhost:8081) and frontend (http://localhost:3000).

services:

  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      # Set DB_PORT (e.g. 5433) if something else on this machine already uses 5432
      - "${DB_PORT:-5432}:5432"
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-example}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8888:8080"

  backend:
    profiles: [app]
    build: ./blog
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-example}
      # Development-only default; set JWT_SECRET (32+ characters) for anything shared
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8081:8081"

  frontend:
    profiles: [app]
    build:
      context: ./frontend/blog-platform
      args:
        # Where the browser reaches the API (baked into the build)
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8081/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Where the Next.js server reaches the API, inside the Docker network
      API_URL: http://backend:8081/api/v1
    ports:
      - "3000:3000"

volumes:
  db-data:
