spring.application.name=blog

server.port=8081

# Database Connection (override with DB_URL / DB_USERNAME / DB_PASSWORD env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:example}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Load lazy collections (e.g. post tags) in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Services return fully-mapped DTOs, so no lazy loading is needed during view rendering
spring.jpa.open-in-view=false

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT signing (HS256). The default is for local development only; set JWT_SECRET (32+ characters) anywhere else.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}
